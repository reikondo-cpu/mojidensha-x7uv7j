<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじでんしゃ"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF"><meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}[hidden]{display:none!important}img{max-width:100%}</style>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</head><body><title>もじでんしゃ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: iPad 一画面アプリ。ヘッダー帯＋各画面。駅名標・路線図・路線カラーで「電車にのって進む」世界をつくり、
   書く練習は国語ノートのマス目（十字リーダー）と赤ペンのはなまる。子ども向けにライトテーマ一本に絞る。 */
:root{
  --bg:#EDF2F6;
  --paper:#FFFFFF;
  --ink:#1F2D3D;
  --ink-soft:#5B6B7D;
  --red:#E0463A;
  --on-dark:#FFFFFF;
  --yellow:#F5C443;
  --rule:#A9C3D3;
  --masu:#7FA5BD;
  --guide:#DCE4EB;
  --steel:#C7CDD4;
  --window:#2C3E50;
  --scrim:rgba(31,45,61,.55);
  --mg:#009CD2;
  --nb:#00AC9B;
  --mt:#0079C2;
  --silver:#7E8A97;
  --silver-bg:#EEF1F4;
  --gold:#C08A12;
  --gold-bg:#FFF3CF;
  --font-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --font-kana:"Klee One","YuKyokasho","Hiragino Mincho ProN",serif;
  --font-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.6 var(--font-ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.bar{flex:none;background:var(--paper);border-bottom:3px solid var(--ink)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* ぜんがめんの とき、Safari が ひだりうえに だす × を よける */
:root.is-fs .bar-in{padding-left:max(96px,env(safe-area-inset-left,0px))}
.bar h1{flex:1;min-width:0;margin:0;font:900 1.3rem/1.25 var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:inline-flex;align-items:center;gap:4px;font:900 1.25rem/1 var(--font-ui);font-variant-numeric:tabular-nums}
.stat svg{width:36px;height:36px}
.stat .hm-sp,.stat .hm-pt{stroke-width:12}
.stat .hm-c{display:none}
.mini-card{width:26px;height:34px;border:3px solid var(--ink);border-radius:5px;background:linear-gradient(var(--mg) 0 34%,var(--paper) 34%)}

main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.view{max-width:1100px;margin-inline:auto;padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view.fill{height:100%;padding-block:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:56px;padding:.55em 1.2em;
  font:700 1.1rem/1.2 var(--font-ui);color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:16px;
  box-shadow:0 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:var(--on-dark)}
.btn.go{background:var(--lc,var(--mg));color:var(--on-dark)}
.btn.big{min-height:68px;font-size:1.4rem;padding-inline:1.6em}
.btn.sm{min-height:44px;font-size:1rem;padding:.3em .9em;box-shadow:0 3px 0 var(--ink)}
.btn svg{width:1.4em;height:1.4em;flex:none}
.btn:disabled{opacity:.4}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;font:700 1rem/1 var(--font-ui);padding:0 1.1em;min-height:48px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}

/* 駅名標 */
.board{--lc:var(--mg);width:min(560px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:14px;overflow:hidden;text-align:center}
.board-top{display:flex;align-items:center;gap:10px;padding:10px 14px 0}
.sym{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border:5px solid var(--lc);border-radius:50%;
  font:900 1rem/1 var(--font-ui);letter-spacing:-.02em;background:var(--paper);color:var(--ink)}
.board-line{font:700 1rem/1 var(--font-ui);color:var(--ink-soft)}
.board-name{font:900 clamp(2.4rem,7vw,3.6rem)/1.15 var(--font-ui);letter-spacing:.06em;padding:4px 12px 0;text-wrap:balance;color:var(--ink)}
.board-kanji{font:700 1.15rem/1.3 var(--font-ui);color:var(--ink-soft);padding-bottom:10px}
.board-band{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--lc);color:var(--on-dark);font:700 1.05rem/1.3 var(--font-ui)}
.board-band span{min-width:0}
.next-label{margin:0;font:900 1.5rem/1.2 var(--font-ui);text-align:center}
/* よてい（これから やること） */
.sched{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
.sched span{padding:6px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font:900 1.1rem/1.2 var(--font-ui)}
.sched i{font-style:normal;font-weight:900;color:var(--on-dark)}

/* home */
.hello{margin:4px 0 16px;font:900 clamp(1.5rem,4vw,2.1rem)/1.3 var(--font-ui);text-wrap:balance}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.courses{grid-template-columns:minmax(0,1fr)}}
.course{--lc:var(--mg);display:flex;flex-direction:column;gap:10px;padding:0;text-align:left;cursor:pointer;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.course:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.course-head{display:flex;align-items:center;gap:12px;padding:14px 16px 0}
.course-head b{display:block;font:900 1.5rem/1.15 var(--font-ui)}
.course-head small{display:block;font:700 .95rem/1.3 var(--font-ui);color:var(--ink-soft)}
.course-goal{margin:0 16px;padding:6px 12px;border-radius:10px;background:var(--bg);font:900 1.15rem/1.3 var(--font-ui)}
.course-now{margin:0 16px;font:700 1rem/1.4 var(--font-ui);color:var(--ink-soft)}
.course-now b{color:var(--ink);font-size:1.15rem}
.rail{position:relative;height:16px;margin:2px 16px 16px;border-radius:999px;background:var(--bg);overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;background:var(--lc);border-radius:inherit}
.tools{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.tool{display:flex;align-items:center;gap:16px;min-height:104px;padding:14px 18px;text-align:left;cursor:pointer;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.tool:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tool b{display:block;font:900 1.4rem/1.2 var(--font-ui)}
.tool small{display:block;font:500 .95rem/1.4 var(--font-ui);color:var(--ink-soft)}
.tool .ic{flex:none;width:72px;height:72px;display:grid;place-items:center;border-radius:14px;background:var(--bg);font:600 2.6rem/1 var(--font-kana)}
.foot{margin-top:22px;display:flex;justify-content:flex-end}
.linkbtn{background:none;border:0;padding:8px;color:var(--ink-soft);font:700 .95rem var(--font-ui);text-decoration:underline;cursor:pointer}

/* 路線図 */
.line-top{display:grid;justify-items:center;gap:12px;margin-bottom:22px}
.route{list-style:none;margin:0 auto;padding:0;max-width:880px}
.stop{--lc:var(--mg);display:grid;grid-template-columns:56px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:76px;position:relative}
.stop::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:12px;background:var(--lc)}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop.todo::before{background:var(--steel)}
.stop .dot{position:relative;z-index:1;justify-self:center;width:34px;height:34px;border-radius:50%;background:var(--paper);border:6px solid var(--lc)}
.stop.todo .dot{border-color:var(--steel)}
.stop .train{position:relative;z-index:2;justify-self:center;width:52px;height:52px}
.stop .train svg{display:block;width:100%;height:100%}
.stop-name{min-width:0}
.stop-name b{display:block;font:900 1.35rem/1.2 var(--font-ui)}
.stop-name small{display:block;font:700 .9rem/1.3 var(--font-ui);color:var(--ink-soft)}
.stop.todo .stop-name b{color:var(--ink-soft)}
.stage-tag{min-width:0;max-width:240px;padding:6px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;
  font:600 1.25rem/1.2 var(--font-kana);color:var(--ink);text-align:center;box-shadow:0 3px 0 var(--ink)}
.stop-act{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.stamp{display:block;width:48px;height:48px;flex:none}
.stamp-sm{width:40px;height:40px}
.stamp-big{width:min(190px,48vw);height:auto}
.stamp-arrive{width:110px;height:110px;animation:stampin .45s cubic-bezier(.3,1.6,.5,1) 3.4s both}
.stamp-in{animation:stampin .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampin{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.chal{min-height:44px;padding:4px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--ink);
  font:900 .95rem/1.2 var(--font-ui);color:var(--ink);cursor:pointer}
.chal:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chal.lv2{background:var(--silver-bg);border-color:var(--silver);box-shadow:0 3px 0 var(--silver)}
.chal.lv3{background:var(--gold-bg);border-color:var(--gold);box-shadow:0 3px 0 var(--gold)}
.stage-tag.done{background:var(--bg)}
.stage-tag.now{background:var(--yellow)}
.stage-tag:disabled{border-style:dashed;box-shadow:none;color:var(--ink-soft);opacity:.7;cursor:default}

/* でんしゃことば（へんせい） */
.consist{max-width:100%;overflow-x:auto;padding:6px 0}
.consist-in{display:flex;flex-direction:row-reverse;gap:3px;width:max-content;margin-inline:auto;padding-bottom:6px;border-bottom:5px solid var(--steel)}
.car svg{display:block;width:clamp(56px,8vw,96px);height:auto}
.stack .car svg{width:clamp(40px,5.4vw,56px)}
.car.new{animation:couple .6s ease-out .25s both}
@keyframes couple{from{transform:translateX(-48px)}to{transform:none}}
.consist.leave{overflow:visible}
.consist.leave .consist-in{animation:leave 2.6s ease-in forwards}
@keyframes leave{to{transform:translateX(130vw)}}
.wlist{display:grid;gap:16px;max-width:900px;margin:0 auto}
.wtrain b{display:block;margin-bottom:6px;font:900 1.05rem var(--font-ui);color:var(--ink-soft)}
.wchips{display:flex;flex-wrap:wrap;gap:10px}
.wemo{font-family:var(--font-emoji);margin-right:6px}

/* 書く */
.ws{display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;height:100%}
.ws-top{display:flex;flex-direction:column;align-items:center;gap:6px}
.ws-row{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.ws-goal{margin:0;font:700 1rem/1.3 var(--font-ui);color:var(--ink-soft)}
.ws-goal b{color:var(--ink);font-size:1.15rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{position:relative;display:grid;place-items:center;width:58px;height:58px;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);
  font:600 2.3rem/1 var(--font-kana)}
.pill.now{background:var(--yellow)}
.pill.ok::after{content:"";position:absolute;inset:4px;border:4px solid var(--red);border-radius:50%;opacity:.85}
.pill.given{border-color:transparent;background:transparent;color:var(--ink)}
.pill.given.small{font-size:1.6rem}
.ws-emo{font:3rem/1 var(--font-emoji)}
.st-band{--lc:var(--mg);display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:12px;background:var(--paper);border:3px solid var(--ink);border-bottom:8px solid var(--lc)}
.ws-body{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;min-height:0}
.stage-area{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
.masu{position:relative;width:300px;height:300px;border-radius:4px;background:var(--paper);box-shadow:0 0 0 3px var(--masu),0 8px 0 3px var(--ink)}
.masu svg,.masu canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.masu canvas{touch-action:none}
.masu .cr{stroke:var(--rule);stroke-width:.7;stroke-dasharray:2 2}
.masu .gd{fill:none;stroke:var(--guide);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.masu .an{fill:none;stroke:var(--red);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.masu .num{font:700 6.5px var(--font-ui);fill:var(--ink-soft)}
.panel{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:14px}
.model{display:grid;justify-items:center;gap:4px}
.model-ch{display:grid;place-items:center;width:112px;height:112px;background:var(--paper);border:3px solid var(--masu);border-radius:6px;font:600 4.8rem/1 var(--font-kana)}
.strokes{margin:0;text-align:center;font-weight:700}
.strokes b{font-size:1.6rem;color:var(--red);font-variant-numeric:tabular-nums}
.panel .seg{align-self:center}
.msg{margin:0;min-height:1.6em;text-align:center;font-weight:900;color:var(--ink);text-wrap:balance}
@media (orientation:portrait),(max-width:900px){
  .ws-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:18px}
  .panel{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
  .msg{flex-basis:100%}
  .model-ch{width:80px;height:80px;font-size:3.4rem}
}

/* クイズ */
.intro{display:grid;justify-items:center;gap:16px;text-align:center}
.intro h2{margin:0;font:900 1.6rem/1.3 var(--font-ui)}
.intro p{margin:0;color:var(--ink-soft);font-weight:700}
.pairs{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.pair{display:grid;justify-items:center;gap:2px;width:108px;padding:10px 0 8px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink)}
.pair:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pair b{font:600 4rem/1.1 var(--font-kana)}
.pair span{font:600 1.5rem/1.2 var(--font-kana);color:var(--ink-soft)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper)}
.dots i.done{background:var(--red);border-color:var(--red)}
.dots i.now{outline:3px solid var(--yellow);outline-offset:2px}
.ask{margin:0 0 10px;text-align:center;font:900 1.4rem/1.3 var(--font-ui)}
.word{width:fit-content;max-width:100%;margin:0 auto;padding:.15em .6em;text-align:center;background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  font:600 clamp(3rem,10vw,5.4rem)/1.25 var(--font-kana);letter-spacing:.08em}
.word.long{font-size:clamp(2rem,6vw,3.4rem)}
.say-big{display:flex;margin:0 auto;width:120px;height:120px;border-radius:50%;padding:0}
.say-big svg{width:64px;height:64px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:620px;margin:20px auto 0}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:760px}
.choices.list{grid-template-columns:minmax(0,1fr);max-width:620px}
.choice{position:relative;aspect-ratio:1.3;max-width:100%;padding:0;cursor:pointer;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  box-shadow:0 5px 0 var(--ink);font:600 clamp(3.2rem,10vw,6rem)/1 var(--font-kana)}
.choices.three .choice{aspect-ratio:1;font:clamp(3rem,10vw,5.6rem)/1 var(--font-emoji)}
.choices.list .choice{aspect-ratio:auto;padding:.4em .6em;font-size:clamp(1.6rem,4.6vw,2.4rem);letter-spacing:.06em}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice.right::after{content:"";position:absolute;inset:8%;border:9px solid var(--red);border-radius:50%;opacity:.9}
.choices.list .choice.right::after{inset:4px 12%;border-width:6px}
.choice.dim{opacity:.35}
.choice.hint{box-shadow:0 0 0 7px var(--yellow),0 5px 0 var(--ink);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}

/* 50音表 */
.gojuon{overflow-x:auto;padding-block:6px 12px}
.gojuon-in{display:flex;gap:8px;width:max-content;margin-inline:auto}
.col{display:flex;flex-direction:column;gap:8px}
.cell{--c:clamp(50px,calc((min(100vw,1100px) - 112px)/11),82px);position:relative;display:grid;place-items:center;width:var(--c);height:var(--c);padding:0;cursor:pointer;
  color:var(--ink);background:var(--paper);border:2.5px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);font:600 calc(var(--c) * .6)/1 var(--font-kana)}
.cell:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.cell.empty{background:transparent;border:2.5px dashed var(--rule);box-shadow:none;cursor:default}
.mk{position:absolute;right:4px;top:4px;width:15px;height:15px;border:2.5px solid var(--red);border-radius:50%}
.mk.m2{width:9px;height:9px;right:7px;top:7px;box-shadow:0 0 0 2px var(--paper),0 0 0 4.5px var(--red)}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:.95rem;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend .mk{position:relative;right:auto;top:auto;display:inline-block}
.subhead{margin:18px 0 6px;font:900 1.1rem var(--font-ui);text-align:center}

/* カード */
.zukan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card-btn{display:block;padding:0;border:0;background:none;cursor:pointer;text-align:left}
.tcard{--lc:var(--mg);position:relative;display:flex;flex-direction:column;width:100%;padding:0;text-align:left;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.tcard-band{height:12px;background:var(--lc)}
.tcard svg{display:block;width:100%;height:auto;padding:8px 6px 0}
.tcard-photo{display:block;margin:8px 8px 0;aspect-ratio:5/2;border-radius:8px;overflow:hidden;background:var(--steel)}
.tcard-photo img{display:block;width:100%;height:100%;object-fit:cover}
.tcard-txt{padding:4px 10px 10px}
.tcard-co{display:block;font:700 .8rem/1.3 var(--font-ui);color:var(--ink-soft)}
.tcard-name{display:block;font:900 1.3rem/1.15 var(--font-ui)}
.tcard-run{display:block;font:700 .8rem/1.35 var(--font-ui);color:var(--ink-soft)}

// v3：えきの すすみかたを かえたので、まえの きろくから はなまる・カード・せっていだけ ひきつぐ
const KEY = 'mojidensha-v3';
const load = () => {
  try {
    const v3 = JSON.parse(localStorage.getItem(KEY));
    if (v3) return v3;
    const v2 = JSON.parse(localStorage.getItem('mojidensha-v2'));
    if (v2) { delete v2.prog; return v2; }
  } catch (e) {}
  return {};
};
// たりない ところを うめる（ふるい きろく・ファイルから よみこんだ きろくにも つかう）
function fillSt(o) {
  // limit：1日に つかう じかん（ふん。0 は きめない）
  // sp：もって いる とくべつカード
  const s = Object.assign({ hm: 0, w: {}, cards: [], sp: [], prog: {}, words: {}, wscript: 'h', strict: 'normal', free: 'h', freeMode: 'trace', vol: {}, melody: true, limit: 60 }, o);
  s.prog = Object.assign({}, s.prog);
  ['mg', 'nb', 'mt'].forEach(k => { if (typeof s.prog[k] !== 'number') s.prog[k] = 0; });
  s.words = Object.assign({ h: 0, k: 0 }, s.words);
  // 駅スタンプ：{ 路線: { 駅のばんごう: 1=なぞって とうちゃく, 2=みて かけた（ぎん）, 3=きいて かけた（きん） } }
  s.stamps = Object.assign({ mg: {}, nb: {}, mt: {} }, s.stamps);
  s.vol = Object.assign({ bgm: 1, sfx: 2 }, s.vol);
  return s;
}
const st = fillSt(load());
// きろくを まるごと いれかえる（ひかえから もどす とき・ファイルを よみこんだ とき）
function replaceSt(o) { const s = fillSt(o); Object.keys(st).forEach(k => delete st[k]); Object.assign(st, s); }
// claude.ai 版で 記録の ファイルを 保存する ところ（ホーム画面アプリでは null）
let claudeDownloads = null;
try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { claudeDownloads = d; }, () => {}); } catch (e) {}
// IndexedDB の ひとつの いれもの。keyPath が なければ key を じぶんで わたす
function idbStore(name, store, keyPath) {
  let db = null;
  const open = () => db || (db = new Promise((res, rej) => {
    try {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(store, keyPath ? { keyPath } : undefined);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  return async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const tx = d.transaction(store, mode), q = fn(tx.objectStore(store));
      tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error);
    });
  };
}
// きろくの ひかえ：iPad の ホーム画面アプリで localStorage が きえる ことが あるので、IndexedDB にも おく。
// t（さいごに ほぞんした じこく）が あたらしい ほうを つかう
const kiroku = idbStore('mojidensha-kiroku', 's');
let backupOn = false;   // はじめに ひかえと くらべるまでは かかない（あたらしい ひかえを ふるい きろくで うわがき しない）
const save = () => {
  st.t = Date.now();
  const s = JSON.stringify(st);
  try { localStorage.setItem(KEY, s); } catch (e) {}
  if (backupOn) kiroku('readwrite', o => o.put(s, 'st')).catch(() => {});
};

// 0=けす 1=ちいさい 2=ふつう 3=おおきい
const VOLS = [0, 0.35, 0.7, 1];
const BGM_BASE = 0.55;
let actx = null, ducked = false;
const bus = {};
// iPad の 消音モードでも 鳴らす（これが ないと Web Audio の 音は 消音モードで 出ない）
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
function audio() {
  try {
    if (!actx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      actx = new C();
      bus.bgm = actx.createGain(); bus.bgm.connect(actx.destination);
      bus.sfx = actx.createGain(); bus.sfx.connect(actx.destination);
      bus.voice = actx.createGain(); bus.voice.connect(actx.destination);
      applyVol();
    }
    // suspended（まだ ゆるされて いない）・interrupted（iPad で アプリを とじて もどった とき）なら うごかしなおす
    if (actx.state !== 'running' && actx.state !== 'closed') actx.resume().catch(() => {});
    return actx;
  } catch (e) { return null; }
}
function applyVol() {
  melodyEl.volume = VOLS[st.vol.sfx];
  if (!actx) return;
  bus.bgm.gain.setTargetAtTime(VOLS[st.vol.bgm] * BGM_BASE * (ducked ? 0.3 : 1), actx.currentTime, 0.12);
  bus.sfx.gain.setTargetAtTime(VOLS[st.vol.sfx], actx.currentTime, 0.05);
}
const duck = on => { ducked = on; applyVol(); };
function tone(f, at, dur, type = 'sine', vol = 0.18, dest) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || bus.sfx);
  o.start(t); o.stop(t + dur + 0.05);
}
let noise = null;
function noiseBuf() {
  if (noise) return noise;
  const a = actx, b = a.createBuffer(1, a.sampleRate, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return (noise = b);
}
function noiseHit(t, dur, vol, type, freq) {
  const a = actx, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf(); s.loop = true;
  f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus.sfx);
  s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  tap() { tone(1046.5, 0, 0.06, 'sine', 0.05); },
  ok() { tone(880, 0, 0.18); tone(1318.5, 0.12, 0.35); },
  soft() { tone(659.25, 0, 0.18, 'sine', 0.07); },
  fanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.13, 0.5, 'triangle', 0.16)); },
  flip() {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
    o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(1600, t + 0.25);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);

const NOTE = n => {
  const m = /^([A-G])(#?)(\d)$/.exec(n); if (!m) return 0;

}

/* ================= はなまる ================= */
function hanamaruSVG() {
  const cx = 100, cy = 100;
  let sp = '';
  const turns = 3.1, steps = 240;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, a = -Math.PI / 2 + t * turns * 2 * Math.PI;
    const r = (6 + t * 54) * (1 + 0.03 * Math.sin(5 * a));
    sp += (i ? 'L' : 'M') + (cx + r * Math.cos(a) * 1.06).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1);
  }
  let pt = '';
  const n = 11, R = 70;
  for (let i = 0; i <= n; i++) {
    const a = -Math.PI / 2 + (i / n) * 2 * Math.PI;
    const x = cx + R * Math.cos(a) * 1.06, y = cy + R * Math.sin(a);
    if (!i) pt += `M${x.toFixed(1)} ${y.toFixed(1)}`;
    else {
      const am = a - Math.PI / n;
      pt += `Q${(cx + (R + 30) * Math.cos(am) * 1.06).toFixed(1)} ${(cy + (R + 30) * Math.sin(am)).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
  }
  return `<svg class="hm" viewBox="-6 -6 212 212" aria-hidden="true"><path class="hm-pt" d="${pt}"/><path class="hm-sp" d="${sp}"/><circle class="hm-c" cx="100" cy="100" r="70"/></svg>`;
}

let praiseTimer = null, praiseDone = null;
function praise(kind, text, then) {
  const el = $('#praise');
  el.classList.toggle('maru', kind === 'maru');
  $('#praiseText').textContent = text;
  el.hidden = false;
  const reduce = reduceMotion();
  (kind === 'maru' ? ['.hm-c'] : ['.hm-sp', '.hm-pt']).forEach((sel, i) => {
    const p = el.querySelector(sel), len = p.getTotalLength();
    p.style.transition = 'none';
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = reduce ? 0 : len;
    p.getBoundingClientRect();
    if (!reduce) { p.style.transition = `stroke-dashoffset ${i ? 0.7 : 0.9}s ease-out ${i ? 0.8 : 0}s`; p.style.strokeDashoffset = 0; }
  });
  kind === 'maru' ? sfx.ok() : sfx.fanfare();
  setTimeout(() => speak(text.replace(/[！!]/g, '。')), 350);

function addHanamaru(then) {
  st.hm++; save(); updateStats();
  if (st.hm % 15 === 0) {
    const left = CARDS.length - st.cards.length;
    const stopsLeft = Object.values(LINES).reduce((n, l) => n + l.stages.length - st.prog[l.id], 0)
      + ['h', 'k'].reduce((n, s) => n + trainsOf(s).filter(t => st.words[s] < t.start + t.len).length, 0);
    const c = left > stopsLeft ? pickCard(null) : null;
    if (c) return () => showCardReward(c, `はなまる ${st.hm}こ ボーナス！`, then);

// 20ぷん つかう ごとに 20びょう めを やすめる（ていしゃ）。どちらも かいている とちゅうでは とめない
const REST_EVERY = 20 * 60000, REST_FOR = 20000, WARN_AT = 5 * 60000;

function useToday() {
  if (!st.use || st.use.d !== dayKey()) { st.use = { d: dayKey(), ms: 0, extra: 0 }; warned = false; }
  return st.use;
}
const limitMs = () => st.limit ? st.limit * 60000 + (useToday().extra || 0) : Infinity;
function paintMeter() {
  const m = $('#useMeter');
  m.hidden = !st.limit;
  if (!st.limit) return;
  const left = Math.max(0, limitMs() - useToday().ms);

  m.classList.toggle('low', left <= WARN_AT);
}
// みえている あいだだけ かぞえる（ていしゃ・しゃこの あいだは かぞえない）
setInterval(() => {
  const now = Date.now(), dt = Math.min(now - lastTick, 10000);
  lastTick = now;
  if (document.hidden || locked || !$('#rest').hidden) return;
  useToday().ms += dt; sinceRest += dt;
  paintMeter();
  if (now - savedTick > 15000) { savedTick = now; save(); }
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); save(); return; }
  lastTick = Date.now();
  if (hiddenAt && Date.now() - hiddenAt > 2 * 60000) sinceRest = 0;   // 2ふん いじょう はなれて いたら やすんだ ことに する
  if (locked) checkpoint();   // つぎの 日に なって いたら あける
});
// くぎりで よぶ。ていしゃ・しゃこを だしたら true
function checkpoint() {
  const over = useToday().ms >= limitMs();
  if (locked && !over) { locked = false; $('#depot').hidden = true; paintMeter(); }
  if (locked || !$('#rest').hidden) return true;
  if (over) { showDepot(); return true; }
  if (sinceRest >= REST_EVERY) { showRest(); return true; }
  if (st.limit && !warned && limitMs() - useToday().ms <= WARN_AT) {
    warned = true;
    setTimeout(() => { if (!locked) speak('あと すこしで しゃこに かえるよ'); }, 2600);
  }
  return false;
}

  // 記録の 書き出し・読み込み（ネットには 送らない）
  const sum = o => `はなまる ${o.hm || 0}・カード ${(o.cards || []).length}まい・進んだ駅 ${Object.values(o.prog || {}).reduce((a, b) => a + (+b || 0), 0)}`;

  body.querySelector('#expBtn').addEventListener('click', async () => {
    save();
    const d = new Date(), p2 = n => String(n).padStart(2, '0');
    const name = `mojidensha-kiroku-${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.json`;

    catch (e) { if (e.name === 'AbortError') return; }

  body.querySelector('#impFile').addEventListener('change', async e => {

    if (!f) return;

    b2.querySelector('#doImp').addEventListener('click', () => { replaceSt(k); save(); updateStats(); closeSheet(); openHome(); });
  });
  body.querySelector('#resetBtn').addEventListener('click', () => {
    const b2 = sheet(`<h2>きろくを ぜんぶ けしますか？</h2><p style="text-align:center">はなまる・カード・すすんだ えきが すべて きえます。</p>

    b2.querySelector('#doReset').addEventListener('click', () => {
      st.hm = 0; st.w = {}; st.cards = []; st.prog = { mg: 0, nb: 0, mt: 0 }; st.words = { h: 0, k: 0 }; st.stamps = { mg: {}, nb: {}, mt: {} }; save(); updateStats(); closeSheet(); openHome();
    });
  });
}

/* ================= 路線図 ================= */
function openLine(id) {
  const line = LINES[id];
  cur.line = line;
  go('line', `${line.kana}（${line.kanji}）`);
  const v = $('#v-line'), p = st.prog[id], n = line.stages.length, done = p >= n;
  const top = done
    ? `<p class="next-label">ゴール！ ぜんぶ クリアしたよ</p>${boardHTML(line, n)}<p style="margin:0;color:var(--ink-soft);font-weight:700">すきな えきを えらんで もういちど あそべるよ</p>`
    : `<p class="next-label">つぎは</p>${boardHTML(line, p + 1)}<button class="btn big go" type="button" id="goBtn" style="--lc:${line.color}">しゅっぱつ！</button>`;
  const stops = line.stations.map((s, i) => {
    const cls = i <= p ? '' : ' todo';
    let tag = '';
    if (i > 0) {
      const state = i <= p ? 'done' : i === p + 1 ? 'now' : '';
      const lv = stampLevel(line, i);
      // とうちゃく した 駅は スタンプと チャレンジ（南北線は よむ コースなので スタンプだけ）
      const chal = state === 'done' && line.id !== 'nb'
        ? `<button class="chal lv${Math.min(lv + 1, 3)}" type="button" data-c="${i - 1}">${lv < 2 ? 'ぎんに チャレンジ' : lv < 3 ? 'きんに チャレンジ' : 'もういちど チャレンジ'}</button>` : '';
      tag = `<span class="stop-act">${i <= p ? stampSVG(line, i, lv) : ''}${chal}<button class="stage-tag ${state}" type="button" data-i="${i - 1}" ${state ? '' : 'disabled'}>${esc(stageLabel(line.stages[i - 1]))}</button></span>`;
    }
    const mark = i === Math.min(p, n) ? `<span class="train">${frontTrain(line.color)}</span>` : '<span class="dot"></span>';
    return `<li class="stop${cls}" style="--lc:${line.color}">${mark}<span class="stop-name"><b>${s[1]}</b><small>${s[0]}</small></span>${tag}</li>`;
  }).join('');
  v.innerHTML = `<div class="line-top">${top}</div><ol class="route">${stops}</ol>`;
  const goBtn = v.querySelector('#goBtn');
  if (goBtn) goBtn.addEventListener('click', () => departure(line, p));
  v.querySelectorAll('.stage-tag:not(:disabled)').forEach(b => b.addEventListener('click', () => departure(line, +b.dataset.i)));
  v.querySelectorAll('.chal').forEach(b => b.addEventListener('click', () => challengeIntro(line, +b.dataset.c)));
  if (!done) setTimeout(() => { if (view === 'line') speak(`つぎは、${line.stations[p + 1][1]}`); }, 300);
}
// これから やることを みせる（みとおし）
function scheduleSteps(line, idx) {
  const steps = stageType(line.stages[idx]) === 'rr'
    ? ['おぼえる', 'クイズ', 'えきの なまえを よむ']
    : [`えきの なまえを かく（${stationBlanks(line, idx).length}もじ）`];
  if (idx === st.prog[line.id]) steps.push('カード');
  return `<div class="sched">${steps.map(s => `<span>${s}</span>`).join('<i>→</i>')}</div>`;
}
function departure(line, idx) {
  const sg = line.stages[idx], goal = stageGoal(sg), next = line.stations[idx + 1], from = line.stations[idx];
  bgmStop(); hush();
  const b = overlay(`<p>つぎは</p>${boardHTML(line, idx + 1)}<p>${esc(goal)}</p>${scheduleSteps(line, idx)}
    <button class="btn big go" type="button" id="startBtn" style="--lc:${line.color}">はじめる</button>`);
  let started = false;
  preloadVoice([`ドアが しまります。つぎは、${next[1]}`, `${next[1]}、${next[1]}です`]);
  playMelody(line, from[0], () => {
    if (started) return;
    sfx.door();
    setTimeout(() => { if (!started) speak(`ドアが しまります。つぎは、${next[1]}`); }, 1500);
  });
  b.querySelector('#startBtn').addEventListener('click', () => { started = true; stopMelody(); hush(); closeOverlay(); startStage(line, idx); });
}

/* ================= 到着とカード ================= */
function pickCard(line) {
  const owned = new Set(st.cards);
  const first = line ? line.first.find(id => !owned.has(id)) : null;
  if (first) return CARDMAP[first];
  const rest = CARDS.filter(c => !owned.has(c.id));
  return rest.length ? rest[Math.floor(Math.random() * rest.length)] : null;
}
// ステージの あと：えきの なまえ → とうちゃく
function stationTask(line, idx) {
  if (line.id === 'nb') return stationRead(line, idx);
  const blanks = stationBlanks(line, idx);
  if (!blanks.length) return arrive(line, idx);
  const name = stationName(line, idx + 1), chars = [...name];
  const items = blanks.map(i => ({ c: chars[i] }));
  writeSession({
    items,
    top: i => `<div class="st-band" style="--lc:${line.color}"><span class="sym" style="--lc:${line.color}">${line.sym}</span><b style="font:900 1.15rem var(--font-ui)">えきの なまえを かいて とうちゃく！</b></div>
      ${wordPills(name, blanks, i)}`,
    goalText: i => `あと <b>${items.length - i}</b>もじで <b>${line.stations[idx + 1][1]}</b> に とうちゃく`,
    say: i => i === 0 ? `${line.stations[idx + 1][1]}。${items[0].c}` : items[i].c,
    onDone: () => arrive(line, idx)
  });
}
// 南北線：カタカナの えきめいを よむ
function stationRead(line, idx) {
  const v = $('#v-stage'), target = line.stations[idx + 1];
  v.classList.remove('fill');
  dropWriter(); bgm('quiz');
  const others = shuffle(line.stations.filter(s => s !== target)).slice(0, 2);
  const opts = shuffle([target, ...others]);
  v.innerHTML = `<div class="intro"><p class="ask">えきの なまえ、なんて よむ？</p>${boardHTML(line, idx + 1, toK(target[1]))}
    <div class="choices list" id="stChoices"></div></div>`;
  let miss = false, lock = false;
  const box = v.querySelector('#stChoices');
  opts.forEach(o => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice'; b.textContent = o[1];
    b.addEventListener('click', () => {
      if (lock || b.disabled) return;
      if (o === target) {
        lock = true; b.classList.remove('hint'); b.classList.add('right'); sfx.ok(); speak(target[1]);
        setTimeout(() => { if (view === 'stage') arrive(line, idx); }, 1500);
      } else {
        b.classList.add('dim'); b.disabled = true; sfx.soft();
        if (!miss) { miss = true; [...box.children][opts.indexOf(target)].classList.add('hint'); }
        speak(target[1]);
      }
    });
    box.append(b);
  });
  setTimeout(() => speak('えきの なまえ、なんて よむかな'), 300);
}
function arrive(line, idx) {
  dropWriter(); bgmStop(); hush();
  const fresh = idx === st.prog[line.id];
  if (fresh) { st.prog[line.id] = idx + 1; save(); }
  setStamp(line, idx + 1, 1);
  const name = line.stations[idx + 1][1], last = idx + 1 === line.stages.length;
  const card = fresh ? pickCard(line) : null;
  const b = overlay(`<svg class="train-run${reduceMotion() ? '' : ' in'}" viewBox="0 0 200 80" aria-hidden="true">${trainSVG({ shape: 'c', body: STEEL, band: line.hex }).replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>
    ${boardHTML(line, idx + 1)}
    ${stampSVG(line, idx + 1, stampLevel(line, idx + 1), 'stamp-arrive')}
    <p>${last ? `しゅうてん ${name}に つきました！<br>コース クリア！` : `${name}に つきました！`}</p>
    <button class="btn big go" type="button" id="arrBtn" style="--lc:${line.color}">${card ? 'カードを もらう' : 'つぎへ'}</button>`);
  const runFor = sfx.train() || 0;
  setTimeout(() => sfx.chime(), runFor * 1000);
  setTimeout(() => sfx.stamp(), runFor * 1000 + 300);
  setTimeout(() => speak(last ? `しゅうてん、${name}です。コースクリア。おめでとう` : `${name}、${name}です`), runFor * 1000 + 900);
  b.querySelector('#arrBtn').addEventListener('click', () => {
    hush();
    if (card) showCardReward(card, last ? 'コース クリアの カード！' : 'カードを ゲット！', () => openLine(line.id));
    else { closeOverlay(); openLine(line.id); }
  });
}
function showCardReward(c, title, then) {
  const have = c.sp ? st.sp : st.cards;
  if (!have.includes(c.id)) { have.push(c.id); save(); updateStats(); }
  const b = overlay(`<p>${esc(title)}</p>
    <div class="flip" id="flip" style="--lc:${cardColor(c)}"><div class="flip-in">
      <div class="flip-back" role="button" tabindex="0" aria-label="カードを めくる">？</div>
      <div class="flip-front">${cardHTML(c, { big: true })}</div></div></div>
    <button class="btn big" type="button" id="cardOk">やったね！</button>`);
  const flip = b.querySelector('#flip');
  const open = () => { if (flip.classList.contains('open')) return; flip.classList.add('open'); sfx.flip(); setTimeout(() => sfx.fanfare(), 350); setTimeout(() => speak(c.yomi), 1100); };
  flip.addEventListener('click', open);
  setTimeout(open, 900);
  b.querySelector('#cardOk').addEventListener('click', () => { closeOverlay(); if (then) then(); });
}

/* ================= カードずかん ================= */
function openZukan() {
  go('zukan', `カードずかん　${st.cards.length} / ${CARDS.length}`);
  const v = $('#v-zukan'), owned = new Set([...st.cards, ...st.sp]);
  const grid = (list, no) => `<div class="zukan">${list.map((c, i) => owned.has(c.id)
    ? `<button type="button" class="card-btn" data-id="${c.id}">${cardHTML(c)}</button>`
    : `<div class="tcard locked${c.sp ? ' sp' : ''}"><span class="tcard-band"></span>${trainSVG(c)}<span class="tcard-txt"><span class="tcard-co">${no(i)}</span><span class="tcard-name">？</span><span class="tcard-run">${c.sp ? 'きんの スタンプや えほんで もらえる' : 'まだ もっていない'}</span></span></div>`).join('')}</div>`;
  v.innerHTML = grid(CARDS, i => `No.${i + 1}`)
    + `<h2 class="zukan-sp">とくべつカード　${st.sp.length} / ${SPECIALS.length}</h2>` + grid(SPECIALS, i => `とくべつ ${i + 1}`);
  v.querySelectorAll('.card-btn').forEach(b => b.addEventListener('click', () => {
    const c = CARDMAP[b.dataset.id];
    sheet(cardHTML(c, { big: true }));
    speak(c.yomi);
  }));
}

/* ================= 書く（マス目） ================= */
// m=はみだしてよい はば、cov=ぜんたいで なぞれた わりあい、each=1かくごとに なぞれた わりあい、out=はみだした わりあい
const STRICT = { easy: { m: 8, cov: 0.4, each: 0.25, out: 0.32 }, normal: { m: 6, cov: 0.5, each: 0.35, out: 0.24 }, hard: { m: 4.5, cov: 0.62, each: 0.5, out: 0.16 } };
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function makeWriter(host) {
  host.innerHTML = '<div class="masu"><svg viewBox="0 0 109 109" aria-hidden="true"></svg><canvas></canvas></div>';
  const masu = host.querySelector('.masu'), svg = host.querySelector('svg'), cv = host.querySelector('canvas');
  const wr = { ch: null, mode: 'trace', strokes: [], S: 300 };
  let curS = null, activePtr = null, penSeen = false, timer = null;
  const ctx = () => { const c = cv.getContext('2d'); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = cssv('--ink'); c.lineWidth = wr.S * 0.055; return c; };
  function drawStroke(c, s, S) {
    if (!s.length) return;
    c.beginPath(); c.moveTo(s[0][0] * S, s[0][1] * S);
    if (s.length === 1) c.lineTo(s[0][0] * S + 0.1, s[0][1] * S);
    for (let i = 1; i < s.length; i++) c.lineTo(s[i][0] * S, s[i][1] * S);
    c.stroke();
  }
  function redraw() { const c = ctx(); c.clearRect(0, 0, wr.S, wr.S); wr.strokes.forEach(s => drawStroke(c, s, wr.S)); }
  function size() {
    const S = Math.floor(Math.min(host.clientWidth - 12, host.clientHeight - 16, 640));
    if (S < 120) return;
    wr.S = S;
    masu.style.width = masu.style.height = S + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = cv.height = Math.round(S * dpr);
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  const ro = new ResizeObserver(size); ro.observe(host);
  function guide() {
    const d = STROKES[wr.ch];
    let h = '<line class="cr" x1="54.5" y1="1" x2="54.5" y2="108"/><line class="cr" x1="1" y1="54.5" x2="108" y2="54.5"/>';
    if (d) {
      if (wr.mode === 'trace') {
        h += d.s.map(p => `<path class="gd" d="${p}"/>`).join('');
        h += d.n.map((p, i) => `<text class="num" x="${p[0]}" y="${p[1]}">${i + 1}</text>`).join('');
      }
      h += d.s.map(p => `<path class="an" d="${p}"/>`).join('');
    }
    svg.innerHTML = h;
  }
  function play() {
    const ps = [...svg.querySelectorAll('.an')];
    let t = 0;
    ps.forEach(p => {
      if (p.getAnimations) p.getAnimations().forEach(a => a.cancel());
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      if (reduceMotion() || !p.animate) { p.style.strokeDashoffset = 0; p.style.opacity = 1; return; }
      const dur = Math.max(420, len * 15);
      p.animate([{ strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1 }], { duration: dur, delay: t, fill: 'forwards', easing: 'ease-in-out' });
      t += dur + 200;
    });
    clearTimeout(timer);
    timer = setTimeout(() => ps.forEach(p => {
      if (p.getAnimations) p.getAnimations().forEach(a => a.cancel());
      if (p.animate && !reduceMotion()) p.animate([{ opacity: 1, strokeDashoffset: 0 }, { opacity: 0, strokeDashoffset: 0 }], { duration: 500, fill: 'forwards' });
      else p.style.opacity = 0;
    }), t + 900);
  }
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  // ぜんがめんで したに なぞると Safari が「スワイプで とじる」と うけとるので、マスの うえの タッチは ここで とめる
  ['touchstart', 'touchmove'].forEach(t => cv.addEventListener(t, e => e.preventDefault(), { passive: false }));
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') penSeen = true;
    if (penSeen && e.pointerType === 'touch') return; // Apple Pencil を つかうときは てのひらを むしする
    if (activePtr !== null) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    activePtr = e.pointerId;
    curS = [pt(e)]; wr.strokes.push(curS);
    drawStroke(ctx(), curS, wr.S);
    if (wr.onInk) wr.onInk();
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerId !== activePtr || !curS) return;
    e.preventDefault();
    let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    if (!evs.length) evs = [e];
    const c = ctx();
    for (const ev of evs) {
      const p = pt(ev), last = curS[curS.length - 1];
      curS.push(p);
      c.beginPath(); c.moveTo(last[0] * wr.S, last[1] * wr.S); c.lineTo(p[0] * wr.S, p[1] * wr.S); c.stroke();
    }
  });
  const end = e => {
    if (e.pointerId !== activePtr) return;
    activePtr = null;
    // うっかり さわった だけの ちいさな てんは けす
    if (curS) {
      let len = 0;
      for (let i = 1; i < curS.length; i++) len += Math.hypot(curS[i][0] - curS[i - 1][0], curS[i][1] - curS[i - 1][1]);
      if (len < 0.012) { wr.strokes.pop(); redraw(); }
    }
    curS = null;
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  function fit(A, N, half) {
    let gx0 = N, gy0 = N, gx1 = 0, gy1 = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (A[(y * N + x) * 4 + 3] > 100) {
      if (x < gx0) gx0 = x; if (x > gx1) gx1 = x; if (y < gy0) gy0 = y; if (y > gy1) gy1 = y;
    }
    gx0 = (gx0 + half) / N; gx1 = (gx1 - half) / N; gy0 = (gy0 + half) / N; gy1 = (gy1 - half) / N;
    let ix0 = 1, iy0 = 1, ix1 = 0, iy1 = 0;
    wr.strokes.forEach(s => s.forEach(([x, y]) => { ix0 = Math.min(ix0, x); ix1 = Math.max(ix1, x); iy0 = Math.min(iy0, y); iy1 = Math.max(iy1, y); }));
    const iw = ix1 - ix0, ih = iy1 - iy0, gw = gx1 - gx0, gh = gy1 - gy0;
    let sx = iw > 0.02 ? gw / iw : 0, sy = ih > 0.02 ? gh / ih : 0;
    if (!sx) sx = sy || 1; if (!sy) sy = sx;
    const icx = (ix0 + ix1) / 2, icy = (iy0 + iy1) / 2, gcx = (gx0 + gx1) / 2, gcy = (gy0 + gy1) / 2;
    return wr.strokes.map(s => s.map(([x, y]) => [(x - icx) * sx + gcx, (y - icy) * sy + gcy]));
  }
  // relax=true のときは「やさしい」で はんてい（2かいめの ちょうせん）
  function judge(relax) {
    const d = STROKES[wr.ch], N = 96, k = N / 109, cfg = relax ? STRICT.easy : (STRICT[st.strict] || STRICT.normal), free = wr.mode === 'free';
    const mk = () => {
      const c = document.createElement('canvas'); c.width = c.height = N;
      const x = c.getContext('2d', { willReadFrequently: true }); x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#000'; return x;
    };
    const paths = d.s.map(p => new Path2D(p));
    const ga = mk(); ga.setTransform(k, 0, 0, k, 0, 0); ga.lineWidth = 7; paths.forEach(p => ga.stroke(p));
    const gb = mk(); gb.setTransform(k, 0, 0, k, 0, 0); gb.lineWidth = 7 + 2 * cfg.m; paths.forEach(p => gb.stroke(p));
    const A = ga.getImageData(0, 0, N, N).data, B = gb.getImageData(0, 0, N, N).data;
    const pts = free ? fit(A, N, 3.5 * k) : wr.strokes;
    const ic = mk(); ic.lineWidth = N * 0.075; pts.forEach(s => drawStroke(ic, s, N));
    const C = ic.getImageData(0, 0, N, N).data;
    let g = 0, cov = 0, ink = 0, out = 0;
    for (let i = 3; i < A.length; i += 4) {
      const a = A[i] > 100, b = B[i] > 100, c = C[i] > 100;
      if (a) { g++; if (c) cov++; }
      if (c) { ink++; if (!b) out++; }
    }
    // 1かくずつ なぞれているか（かきわすれた せんが ないか）
    const needEach = cfg.each - (free ? 0.08 : 0);
    const missing = paths.some(p => {
      const one = mk(); one.setTransform(k, 0, 0, k, 0, 0); one.lineWidth = 7; one.stroke(p);
      const D = one.getImageData(0, 0, N, N).data;
      let n = 0, hit = 0;
      for (let i = 3; i < D.length; i += 4) if (D[i] > 100) { n++; if (C[i] > 100) hit++; }
      return n && hit / n < needEach;
    });
    const coverage = g ? cov / g : 0, outside = ink ? out / ink : 1;
    const needCov = cfg.cov - (free ? 0.08 : 0), maxOut = cfg.out + (free ? 0.08 : 0);
    const pass = coverage >= needCov && outside <= maxOut && !missing;
    return { pass, perfect: pass && wr.strokes.length === d.s.length, need: d.s.length };
  }
  return Object.assign(wr, {
    set(ch, mode) { wr.ch = ch; wr.mode = mode || 'trace'; wr.strokes = []; guide(); redraw(); },
    play, judge,
    undo() { wr.strokes.pop(); redraw(); },
    clear() { wr.strokes = []; redraw(); },
    destroy() { ro.disconnect(); clearTimeout(timer); }
  });
}

// しっぱいを みせない：1かいめ → いっしょに なぞる、2かいめ → やさしい はんてい、3かいめ → かならず できた
const HELP_MSG = ['いっしょに なぞってみよう', 'おてほんを みながら ゆっくり なぞろう'];
function checkWriting(wr, fails) {
  if (!wr.strokes.length) return { empty: true };
  const r = wr.judge(fails >= 1);
  if (r.pass) return r;
  if (fails >= 2) return { pass: true, forced: true, perfect: false, need: r.need };
  return r;
}
function praiseFor(r, then, free) {
  if (r.forced) return praise('maru', 'よく がんばったね！', then);
  if (r.perfect) return praise('hanamaru', free ? 'すごい！ じぶんで かけたね' : 'じょうずに かけたね！', addHanamaru(then));
  praise('maru', `よく かけたね！ つぎは ${r.need}かいで かいてみよう`, then);
}

/* ================= ステージ ================= */
function startStage(line, idx) {
  cur.mode = 'line'; cur.line = line; cur.idx = idx;
  const t = stageType(line.stages[idx]);
  go('stage', `${line.kana}　つぎは ${line.stations[idx + 1][1]}`, null);
  if (t === 'sn') stationTask(line, idx);
  else readStage(line, idx);
}
// ことばを 1もじずつ かく ときの うえの ひょうじ（かかない もじは さいしょから はいっている）
//   show=true のときは、これから かく もじも みせる（チャレンジの「みて かく」）
function wordPills(word, blanks, i, show) {
  const done = new Set(blanks.slice(0, i)), now = blanks[i];
  return `<div class="pills">${[...word].map((c, k) => {
    if (c === ' ') return '<span class="pill given small"></span>';
    if (!blanks.includes(k)) return `<span class="pill given${STROKES[c] ? '' : ' small'}">${c}</span>`;
    if (done.has(k)) return `<span class="pill ok">${c}</span>`;
    return `<span class="pill${k === now ? ' now' : ''}">${show ? c : ''}</span>`;
  }).join('')}</div>`;
}

// かく がめん（えきめい・ことば・チャレンジ で つかう）
//   mode='free' は チャレンジ（マスに おてほんを ださない）。2かい うまく いかないと その もじだけ おてほんを だす（hinted）
//   hideModel=true は みぎの おてほんの もじも かくす（きいて かく）
function writeSession({ items, top, say, onDone, music = 'write', goalText, mode = 'trace', hideModel = false }) {
  const v = $('#v-stage');
  v.classList.add('fill');
  bgm(music);
  v.innerHTML = `<div class="ws"><div class="ws-top"><div class="ws-row" id="wsTop"></div><p class="ws-goal" id="wsGoal"></p></div>
    <div class="ws-body"><div class="stage-area" id="area"></div>
      <div class="panel">
        <div class="model"><span class="model-ch" id="modelCh"></span></div>
        <p class="strokes"><b id="kStrokes"></b> かいで かくよ</p>
        <button class="btn" type="button" id="kPlay">${PLAY} おてほん</button>
        <button class="btn" type="button" id="kSay">${SPK} きく</button>
        <div class="row"><button class="btn sm" type="button" id="kUndo">ひとつ もどす</button><button class="btn sm" type="button" id="kClear">ぜんぶ けす</button></div>
        <button class="btn big red" type="button" id="kDone">できた！</button>
        <p class="msg" id="kMsg" aria-live="polite"></p>
      </div></div></div>`;
  dropWriter();
  const wr = activeWriter = makeWriter(v.querySelector('#area'));
  let i = 0, fails = 0, hinted = false, curMode = mode;
  preloadVoice(items.map((_, k) => say(k)));
  const setMsg = m => { v.querySelector('#kMsg').textContent = m; };
  const playBtn = v.querySelector('#kPlay');
  wr.onInk = () => setMsg('');
  function setMode(m) {
    curMode = m;
    wr.set(items[i].c, m);
    playBtn.hidden = m === 'free';
    v.querySelector('#modelCh').textContent = hideModel && m === 'free' ? '？' : items[i].c;
  }
  function show() {
    const it = items[i];
    fails = 0;
    v.querySelector('#wsTop').innerHTML = top(i);
    v.querySelector('#wsGoal').innerHTML = goalText ? goalText(i) : '';
    v.querySelector('#kStrokes').textContent = STROKES[it.c].s.length;
    setMsg('');
    setMode(mode);
    const k = i;
    setTimeout(() => { if (i === k && activeWriter === wr) { speak(say(k)); if (curMode === 'trace') wr.play(); } }, 350);
  }
  playBtn.addEventListener('click', () => wr.play());
  v.querySelector('#kSay').addEventListener('click', () => { if (i < items.length) speak(say(i)); });
  v.querySelector('#kUndo').addEventListener('click', () => { wr.undo(); setMsg(''); });
  v.querySelector('#kClear').addEventListener('click', () => { wr.clear(); setMsg(''); });
  v.querySelector('#kDone').addEventListener('click', () => {
    const r = checkWriting(wr, fails), it = items[i];
    if (r.empty) { const m = curMode === 'free' ? 'マスの なかに かいてみよう' : 'うすい もじを なぞってね'; setMsg(m); speak(m); return; }
    if (!r.pass) {
      sfx.soft();
      if (curMode === 'free') {
        // チャレンジ：1かいめは もういちど、2かいめは その もじだけ おてほんを だす
        if (fails === 0) { fails = 1; const m = 'もういちど かいてみよう'; setMsg(m); speak(m); wr.clear(); return; }
        hinted = true; fails = 0;
        const m = 'おてほんを だすね。なぞって みよう';
        setMode('trace'); setMsg(m); speak(m); setTimeout(() => wr.play(), 500);
        return;
      }
      const m = HELP_MSG[Math.min(fails, 1)];
      fails++; setMsg(m); speak(m);
      wr.clear(); setTimeout(() => wr.play(), 500);
      return;
    }
    if (!r.forced) { const mark = st.w[it.c] || (st.w[it.c] = {}); if (curMode === 'free') mark.f = 1; else mark.t = 1; save(); }
    praiseFor(r, () => {
      i++;
      if (i < items.length) show();
      else { dropWriter(); onDone(hinted); }
    }, curMode === 'free');
  });
  show();
}
/* ----- チャレンジ（おてほん なしで えきめいを かく → 駅スタンプが グレードアップ） ----- */
function challengeIntro(line, idx) {
  const n = idx + 1, level = stampLevel(line, n) < 2 ? 2 : 3, listen = level === 3;
  hush();
  const b = overlay(`<p>${listen ? 'きいて かく' : 'みて かく'} チャレンジ</p>
    ${stampSVG(line, n, level, 'stamp-big')}
    <p style="font-size:1.15rem">${listen ? 'えきの なまえを きいて' : 'うすい おてほん なしで'}<br>「${esc(line.stations[n][1])}」が かけたら ${STAMP_NAME[level]}！</p>
    <div class="row"><button class="btn big go" type="button" id="chGo" style="--lc:${line.color}">はじめる</button><button class="btn" type="button" id="chNo">やめる</button></div>`);
  setTimeout(() => speak(`${listen ? 'きいて かく' : 'みて かく'}チャレンジ。${line.stations[n][1]}が かけたら、${STAMP_NAME[level]}`), 300);
  b.querySelector('#chGo').addEventListener('click', () => { closeOverlay(); challenge(line, idx, level); });
  b.querySelector('#chNo').addEventListener('click', () => { hush(); closeOverlay(); });
}
function challenge(line, idx, level) {
  cur.mode = 'line'; cur.line = line; cur.idx = idx;
  const n = idx + 1, listen = level === 3;
  go('stage', `${line.kana}　チャレンジ`, null);
  const name = stationName(line, n), chars = [...name], blanks = writable(name), items = blanks.map(k => ({ c: chars[k] }));
  writeSession({
    items, mode: 'free', hideModel: listen,
    top: i => `<div class="st-band" style="--lc:${line.color}">${stampSVG(line, n, level, 'stamp-sm')}<b style="font:900 1.15rem var(--font-ui)">${listen ? 'きいて かこう' : 'みて かこう'}</b></div>
      ${wordPills(name, blanks, i, !listen)}`,
    goalText: i => `おてほん なしで あと <b>${items.length - i}</b>もじ`,
    say: i => i === 0 ? `${line.stations[n][1]}。${items[0].c}` : items[i].c,
    onDone: hinted => challengeDone(line, idx, level, hinted)
  });
}
function challengeDone(line, idx, level, hinted) {
  dropWriter(); bgmStop(); hush();
  const n = idx + 1, before = stampLevel(line, n), up = !hinted && level > before;
  if (up) setStamp(line, n, level);
  const text = up ? `${STAMP_NAME[level]}に なった！` : hinted ? 'さいごまで かけたね！ つぎは おてほん なしで いけるかな' : 'おてほん なしで かけたね！';
  // きんの スタンプは とくべつカードも もらえる
  const sp = up && level === 3 ? pickSpecial() : null;
  const b = overlay(`${stampSVG(line, n, stampLevel(line, n), up ? 'stamp-big stamp-in' : 'stamp-big')}<p>${text}</p>
    <button class="btn big go" type="button" id="chBack" style="--lc:${line.color}">${sp ? 'とくべつカードを もらう' : 'ろせんずに もどる'}</button>`);
  if (up) { sfx.stamp(); setTimeout(() => sfx.fanfare(), 400); }
  else sfx.ok();
  setTimeout(() => speak(text.replace(/[！!]/g, '。')), 700);
  b.querySelector('#chBack').addEventListener('click', () => {
    hush();
    if (sp) showCardReward(sp, 'きんの スタンプの とくべつカード！', () => openLine(line.id));
    else { closeOverlay(); openLine(line.id); }
  });
}

// 読む ステージ（南北線）：えきめいに でてくる カタカナを おぼえて クイズ
function readStage(line, idx) {
  const v = $('#v-stage'), chars = [...line.stages[idx][1]], learned = learnedUpTo(line, idx);
  v.classList.remove('fill');
  bgm('quiz');
  v.innerHTML = `<div class="intro"><h2>「${esc(stationName(line, idx + 1))}」の カタカナ</h2><p>さわると こえが でるよ。したの ひらがなと おなじ おとだよ</p>
    <div class="pairs">${chars.map(c => `<button class="pair" type="button" data-c="${c}"><b>${c}</b><span>${toScript(c, 'h')}</span></button>`).join('')}</div>
    <button class="btn big red" type="button" id="qGo">クイズ スタート</button></div>`;
  v.querySelectorAll('.pair').forEach(b => b.addEventListener('click', () => speak(b.dataset.c)));
  v.querySelector('#qGo').addEventListener('click', () => runQuiz(line, idx, makeCharQs(chars, learned, Math.min(8, Math.max(5, chars.length)))));
  setTimeout(() => speak(`${line.stations[idx + 1][1]}の カタカナを おぼえよう`), 300);
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function sample(pool, n) {
  let out = [];
  while (out.length < n) {
    const nx = shuffle(pool.slice());
    if (out.length && nx.length > 1 && nx[0] === out[out.length - 1]) nx.push(nx.shift());
    out = out.concat(nx);
  }
  return out.slice(0, n);
}
const NO_HEAR = ['ヂ', 'ヅ'];
function makeCharQs(targets, pool, n) {
  const kinds = ['hear', 'k2h', 'h2k'];
  return sample(targets, n).map((c, i) => {
    const kind = NO_HEAR.includes(c) ? 'k2h' : kinds[i % 3];
    const others = shuffle(pool.filter(x => x !== c && !sameSound(x, c)));
    const opts = shuffle([c, ...others.slice(0, Math.min(3, others.length))]);
    return { kind, c, opts: opts.map(x => ({ label: kind === 'k2h' ? toScript(x, 'h') : x, ok: x === c })) };
  });
}
// クイズ：まちがえても ×は ださず、こたえを そっと しらせる
function runQuiz(line, idx, qs) {
  const v = $('#v-stage');
  let i = 0, firstTry = 0, miss = false, lock = false;
  bgm('quiz');
  v.innerHTML = `<div class="qhead"><div class="dots" id="qDots"></div><button class="btn" type="button" id="qSay"></button></div>
    <div id="qPrompt"></div><div class="choices" id="qChoices"></div>`;
  const sayBtn = v.querySelector('#qSay');
  let sayFn = null;
  sayBtn.addEventListener('click', () => sayFn && sayFn());
  function show() {
    const q = qs[i];
    miss = false; lock = false;
    v.querySelector('#qDots').innerHTML = qs.map((_, k) => `<i class="${k < i ? 'done' : ''}${k === i ? ' now' : ''}"></i>`).join('');
    const pr = v.querySelector('#qPrompt'), box = v.querySelector('#qChoices');
    if (q.kind === 'hear') {
      pr.innerHTML = `<p class="ask">きこえた もじは どれかな？</p><button class="btn say-big" type="button" id="bigSay" aria-label="もういちど きく">${SPK}</button>`;
      pr.querySelector('#bigSay').addEventListener('click', () => speak(q.c));
      sayBtn.innerHTML = SPK + ' もういちど きく';
      sayFn = () => speak(q.c);
      setTimeout(() => { if (qs[i] === q && view === 'stage') speak(q.c); }, 300);
    } else if (q.kind === 'k2h') {
      pr.innerHTML = `<p class="ask">この カタカナ、ひらがなで どれ？</p><div class="word">${q.c}</div>`;
      sayBtn.innerHTML = SPK + ' よんでもらう';
      sayFn = () => speak(q.c);
    } else {
      pr.innerHTML = `<p class="ask">カタカナで かくと どれ？</p><div class="word">${toScript(q.c, 'h')}</div>`;
      sayBtn.innerHTML = SPK + ' よんでもらう';
      sayFn = () => speak(q.c);
    }
    box.innerHTML = '';
    q.opts.forEach(o => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice'; b.textContent = o.label;
      b.addEventListener('click', () => answer(b, o.ok, q));
      box.append(b);
    });
  }
  function answer(b, ok, q) {
    if (lock || b.disabled) return;
    if (ok) {
      lock = true;
      b.classList.remove('hint'); b.classList.add('right'); sfx.ok();
      if (!miss) firstTry++;
      setTimeout(() => speak(q.c), 200);
      setTimeout(() => { if (view !== 'stage') return; i++; i < qs.length ? show() : finish(); }, 1300);
    } else {
      b.classList.add('dim'); b.disabled = true; sfx.soft();
      if (!miss) {
        miss = true;
        const right = [...v.querySelectorAll('#qChoices .choice')][q.opts.findIndex(o => o.ok)];
        if (right) right.classList.add('hint');
      }
      setTimeout(() => speak(q.c), 300);
    }
  }
  function finish() {
    const next = () => stationTask(line, idx);
    if (firstTry >= Math.ceil(qs.length * 0.8)) praise('hanamaru', 'ぜんぶ できたね！ はなまる！', addHanamaru(next));
    else praise('maru', 'ぜんぶ できたね！', next);
  }
  show();
}

/* ================= でんしゃことば ================= */
// へんせいの くぎり：[{ n, start, len, color }]
function trainsOf(s) {
  let start = 0;
  return TRAINS[s].map((len, n) => { const t = { n, start, len, color: TRAIN_COLORS[n % TRAIN_COLORS.length] }; start += len; return t; });
}
const trainAt = (s, i) => trainsOf(s).find(t => i < t.start + t.len);
// 1りょうぶんの え（head=せんとう しゃりょう、on=つながっている）。せんとうは みぎむき
function carSVG(color, head, on) {
  if (!on) return '<svg viewBox="0 0 120 56" aria-hidden="true"><rect x="3" y="6" width="114" height="40" rx="8" fill="none" stroke="var(--steel)" stroke-width="3" stroke-dasharray="7 6"/></svg>';
  const body = head ? 'M8 6 H100 Q117 6 117 24 V46 H3 V11 Q3 6 8 6 Z' : 'M8 6 H112 Q117 6 117 11 V46 H3 V11 Q3 6 8 6 Z';
  return `<svg viewBox="0 0 120 56" aria-hidden="true"><path d="${body}" fill="var(--steel)" stroke="var(--ink)" stroke-width="2.5"/>
    ${head ? '<path d="M100 12 Q110 13 112 24 H100 Z" fill="var(--window)"/>' : ''}
    ${(head ? [12, 40, 68] : [16, 48, 80]).map(x => `<rect x="${x}" y="12" width="22" height="12" rx="2" fill="var(--window)"/>`).join('')}
    <rect x="3" y="29" width="114" height="5" fill="${color}"/>
    <g fill="var(--ink)"><circle cx="24" cy="49" r="5"/><circle cx="38" cy="49" r="5"/><circle cx="82" cy="49" r="5"/><circle cx="96" cy="49" r="5"/></g></svg>`;
}
function consistHTML(t, filled, hl) {
  return `<div class="consist"><div class="consist-in">${Array.from({ length: t.len }, (_, k) =>
    `<span class="car${k === hl ? ' new' : ''}">${carSVG(t.color, k === 0, k < filled)}</span>`).join('')}</div></div>`;
}
function openWords(s) {
  st.wscript = s; save();
  go('words', 'でんしゃことば');
  const v = $('#v-words'), list = TWORDS[s], done = st.words[s];
  const t = done < list.length ? trainAt(s, done) : null, filled = t ? done - t.start : 0;
  const top = t
    ? `<p class="next-label">${t.n + 1}ばんめの でんしゃ（${t.len}りょう へんせい）</p>${consistHTML(t, filled)}
       <p class="ws-goal">あと <b>${t.len - filled}</b>りょう つないだら しゅっぱつ</p>
       <button class="btn big go" type="button" id="wGo" style="--lc:${t.color}">「${esc(list[done].w)}」を かく</button>`
    : '<p class="next-label">ぜんぶの でんしゃが できたよ！</p><p class="ws-goal">すきな ことばを えらんで もういちど かけるよ</p>';
  v.innerHTML = `<div class="row" style="margin-bottom:14px"><div class="seg" id="wScript"><button type="button" data-s="h">ひらがな</button><button type="button" data-s="k">カタカナ</button></div></div>
    <div class="line-top">${top}</div>
    <div class="wlist">${trainsOf(s).map(tr => `<div class="wtrain"><b>${tr.n + 1}ばんめの でんしゃ</b><div class="wchips">${list.slice(tr.start, tr.start + tr.len).map((o, k) => {
      const i = tr.start + k, state = i < done ? 'done' : i === done ? 'now' : '';
      return `<button class="stage-tag ${state}" type="button" data-i="${i}" ${state ? '' : 'disabled'}>${o.e ? `<span class="wemo">${o.e}</span>` : ''}${esc(o.w)}</button>`;
    }).join('')}</div></div>`).join('')}</div>`;
  v.querySelectorAll('#wScript button').forEach(b => {
    b.classList.toggle('on', b.dataset.s === s);
    b.addEventListener('click', () => { if (b.dataset.s !== s) openWords(b.dataset.s); });
  });
  const wGo = v.querySelector('#wGo');
  if (wGo) wGo.addEventListener('click', () => wordStage(s, done));
  v.querySelectorAll('.wchips .stage-tag:not(:disabled)').forEach(b => b.addEventListener('click', () => wordStage(s, +b.dataset.i)));
  if (t) setTimeout(() => { if (view === 'words') speak(`つぎの ことばは、${list[done].w}`); }, 300);
}
// ことばの まえに、その ことばで はじめて でてくる もじを れんしゅう
function wordStage(s, i) {
  const list = TWORDS[s], it = list[i];
  cur.mode = 'words'; cur.ws = s;
  go('stage', `でんしゃことば　「${it.w}」`, null);
  const blanks = writable(it.w), chars = [...it.w], items = blanks.map(k => ({ c: chars[k] }));
  writeSession({
    items,
    top: k => `${it.e ? `<span class="ws-emo">${it.e}</span>` : ''}${wordPills(it.w, blanks, k)}`,
    goalText: k => `あと <b>${items.length - k}</b>もじで 1りょう つながるよ`,
    say: k => k === 0 ? `${it.w}。${items[0].c}` : items[k].c,
    onDone: () => coupled(s, i)
  });
}
// 1りょう つながる。へんせいが できたら しゅっぱつして カード
function coupled(s, i) {
  dropWriter(); bgmStop(); hush();
  const list = TWORDS[s], fresh = i === st.words[s];
  if (!fresh) {
    const b = overlay(`<p>「${esc(list[i].w)}」が かけたね！</p><button class="btn big" type="button" id="cBtn">つぎへ</button>`);
    b.querySelector('#cBtn').addEventListener('click', () => { closeOverlay(); openWords(s); });
    return;
  }
  st.words[s] = i + 1; save();
  const t = trainAt(s, i), filled = i - t.start + 1, full = filled === t.len;
  const b = overlay(`<p>${full ? `${t.len}りょう へんせいの でんしゃが できた！` : `${filled}りょうめが つながった！`}</p>${consistHTML(t, filled, filled - 1)}
    <button class="btn big go" type="button" id="cBtn" style="--lc:${t.color}">${full ? 'しゅっぱつ！' : 'つぎへ'}</button>`);
  setTimeout(() => sfx.couple(), 350);
  setTimeout(() => speak(full ? `${t.len}りょう へんせいの でんしゃが できた` : `${filled}りょうめ、れんけつ`), 1000);
  const btn = b.querySelector('#cBtn');
  btn.addEventListener('click', () => {
    if (!full) { closeOverlay(); openWords(s); return; }
    btn.disabled = true; hush();
    sfx.door();
    setTimeout(() => { if (!reduceMotion()) b.querySelector('.consist').classList.add('leave'); sfx.leave(); }, 1300);
    setTimeout(() => {
      const card = pickCard(null);
      if (card) showCardReward(card, 'しゅっぱつ しんこう！ カードを ゲット！', () => openWords(s));
      else { closeOverlay(); openWords(s); }
    }, 4200);
  });
}

/* ================= じゆうれんしゅう ================= */
const freeState = { writing: false };
const markHTML = c => { const w = st.w[c]; if (!w) return ''; return w.f ? '<i class="mk m2"></i>' : '<i class="mk"></i>'; };
function gridEl(rows, s, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'gojuon'; wrap.dir = 'rtl';
  const inner = document.createElement('div'); inner.className = 'gojuon-in'; wrap.append(inner);
  for (const r of rows) {
    const col = document.createElement('div'); col.className = 'col'; col.dir = 'ltr';
    for (const c of cells(r, s)) {
      if (!c) { const e = document.createElement('span'); e.className = 'cell empty'; col.append(e); continue; }
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'cell';
      b.innerHTML = `<span>${c}</span>${markHTML(c)}`;
      b.addEventListener('click', () => onPick(c));
      col.append(b);
    }
    inner.append(col);
  }
  return wrap;
}
function openFree() {
  freeState.writing = false;
  go('free', 'じゆうれんしゅう', 'write');
  const v = $('#v-free');
  v.classList.remove('fill');
  v.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="seg" id="fScript"><button type="button" data-s="h">ひらがな</button><button type="button" data-s="k">カタカナ</button></div></div>
    <p style="margin:0 0 8px;text-align:center;font-weight:700;color:var(--ink-soft)">もじを さわってね</p>
    <div id="g1"></div><p class="subhead">てんてん・まる</p><div id="g2"></div>
    <div class="legend"><span><i class="mk"></i>なぞれた</span><span><i class="mk m2"></i>みて かけた</span></div>`;
  v.querySelectorAll('#fScript button').forEach(b => {
    b.classList.toggle('on', b.dataset.s === st.free);
    b.addEventListener('click', () => { st.free = b.dataset.s; save(); openFree(); });
  });
  v.querySelector('#g1').append(gridEl(ROWS, st.free, openKanaCard));
  v.querySelector('#g2').append(gridEl(DROWS, st.free, openKanaCard));
}
const hl = (w, c) => { const i = w.indexOf(c); return i < 0 ? esc(w) : esc(w.slice(0, i)) + `<b>${c}</b>` + esc(w.slice(i + c.length)); };
function glyphSVG(c) {
  const d = STROKES[c];
  return `<svg viewBox="0 0 109 109" aria-hidden="true"><line class="cr" x1="54.5" y1="1" x2="54.5" y2="108"/><line class="cr" x1="1" y1="54.5" x2="108" y2="54.5"/>
    ${d.s.map(p => `<path class="st" d="${p}"/>`).join('')}${d.s.map(p => `<path class="an" d="${p}"/>`).join('')}
    ${d.n.map((p, i) => `<text class="num" x="${p[0]}" y="${p[1]}">${i + 1}</text>`).join('')}</svg>`;
}
function animateGlyph(root) {
  if (reduceMotion()) return;
  let t = 0;
  root.querySelectorAll('.an').forEach(p => {
    const len = p.getTotalLength(), dur = Math.max(420, len * 15);
    p.style.strokeDasharray = len;
    if (p.animate) p.animate([{ strokeDashoffset: len, opacity: 1 }, { strokeDashoffset: 0, opacity: 1 }], { duration: dur, delay: t, fill: 'forwards' });
    t += dur + 200;
  });
}
function openKanaCard(c) {
  const list = allChars(st.free), i = list.indexOf(c), { w, e } = W[c] || { w: '', e: '' };
  const body = sheet(`<div class="kcard">
      <div class="kcard-glyph" id="kg">${glyphSVG(c)}</div>
      <div class="kcard-word">${e ? `<span class="emo">${e}</span>` : ''}<span>${w ? hl(w, c) : '<small style="font:700 1.1rem var(--font-ui);color:var(--ink-soft)">あまり つかわない もじだよ</small>'}</span></div>
      <div class="row">
        <button class="btn nav" type="button" id="cPrev" aria-label="まえの もじ">‹</button>
        <button class="btn" type="button" id="cSay">${SPK} きく</button>
        <button class="btn" type="button" id="cPlay">${PLAY} かきじゅん</button>
        <button class="btn red" type="button" id="cWrite">かいてみる</button>
        <button class="btn nav" type="button" id="cNext" aria-label="つぎの もじ">›</button>
      </div></div>`);
  const say = () => speak(w ? `${c}。${w.replace(/\s/g, '')}` : c);
  body.querySelector('#cSay').addEventListener('click', say);
  body.querySelector('#cPlay').addEventListener('click', () => { const g = body.querySelector('#kg'); g.innerHTML = glyphSVG(c); animateGlyph(g); });
  body.querySelector('#cPrev').addEventListener('click', () => openKanaCard(list[(i - 1 + list.length) % list.length]));
  body.querySelector('#cNext').addEventListener('click', () => openKanaCard(list[(i + 1) % list.length]));
  body.querySelector('#cWrite').addEventListener('click', () => { closeSheet(); freeWrite(c); });
  animateGlyph(body.querySelector('#kg'));
  say();
}
function freeWrite(c) {
  freeState.writing = true;
  go('free', 'じゆうれんしゅう　かく', 'write');
  const v = $('#v-free');
  v.classList.add('fill');
  const list = allChars(st.free);
  v.innerHTML = `<div class="ws" style="grid-template-rows:minmax(0,1fr)"><div class="ws-body"><div class="stage-area" id="area"></div>
    <div class="panel">
      <div class="row"><button class="btn nav" type="button" id="fPrev" aria-label="まえの もじ">‹</button><span class="model-ch" id="modelCh"></span><button class="btn nav" type="button" id="fNext" aria-label="つぎの もじ">›</button></div>
      <p class="strokes"><b id="kStrokes"></b> かいで かくよ</p>
      <div class="seg" id="fMode"><button type="button" data-m="trace">なぞる</button><button type="button" data-m="free">みて かく</button></div>
      <div class="row"><button class="btn sm" type="button" id="kPlay">${PLAY} おてほん</button><button class="btn sm" type="button" id="kSay">${SPK} きく</button></div>
      <div class="row"><button class="btn sm" type="button" id="kUndo">ひとつ もどす</button><button class="btn sm" type="button" id="kClear">ぜんぶ けす</button></div>
      <button class="btn big red" type="button" id="kDone">できた！</button>
      <p class="msg" id="kMsg" aria-live="polite"></p>
    </div></div></div>`;
  dropWriter();
  const wr = activeWriter = makeWriter(v.querySelector('#area'));
  let fails = 0;
  const setMsg = m => { v.querySelector('#kMsg').textContent = m; };
  wr.onInk = () => setMsg('');
  const paintMode = () => v.querySelectorAll('#fMode button').forEach(b => b.classList.toggle('on', b.dataset.m === st.freeMode));
  function show(ch) {
    c = ch; fails = 0;
    v.querySelector('#modelCh').textContent = c;
    v.querySelector('#kStrokes').textContent = STROKES[c].s.length;
    paintMode(); setMsg('');
    wr.set(c, st.freeMode);
    setTimeout(() => { speak(c); wr.play(); }, 300);
  }
  const step = d => show(list[(list.indexOf(c) + d + list.length) % list.length]);
  v.querySelector('#fPrev').addEventListener('click', () => step(-1));
  v.querySelector('#fNext').addEventListener('click', () => step(1));
  v.querySelector('#fMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.freeMode = b.dataset.m; save(); show(c); });
  v.querySelector('#kPlay').addEventListener('click', () => wr.play());
  v.querySelector('#kSay').addEventListener('click', () => speak(c));
  v.querySelector('#kUndo').addEventListener('click', () => { wr.undo(); setMsg(''); });
  v.querySelector('#kClear').addEventListener('click', () => { wr.clear(); setMsg(''); });
  v.querySelector('#kDone').addEventListener('click', () => {
    const r = checkWriting(wr, fails), free = st.freeMode === 'free';
    if (r.empty) { setMsg('マスの なかに かいてみよう'); return; }
    if (!r.pass) {
      const m = free ? 'おてほんを みてから もういちど かいてみよう' : HELP_MSG[Math.min(fails, 1)];
      fails++; sfx.soft(); setMsg(m); speak(m);
      wr.clear(); setTimeout(() => wr.play(), 500);
      return;
    }
    if (!r.forced) { const mark = st.w[c] || (st.w[c] = {}); if (free) mark.f = 1; else mark.t = 1; save(); }
    fails = 0;
    praiseFor(r, () => { wr.clear(); checkpoint(); }, free);   // 1もじ かけたら くぎり
  });
  show(c);
}

/* ================= ぜんがめん ================= */
// つかえる ばしょ（Safari など）でだけ ボタンを だす
const fsBtn = $('#fsBtn'), fsRoot = document.documentElement;
const fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
// ホーム画面から ひらいた ときは もともと がめん いっぱい なので だささない
const standalone = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
fsBtn.hidden = standalone || !(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const paintFs = () => {
  fsBtn.textContent = fsOn() ? 'もとに もどす' : 'ぜんがめん';
  fsRoot.classList.toggle('is-fs', !!fsOn());
};
fsBtn.addEventListener('click', () => {
  try {
    const r = fsOn()
      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen).call(fsRoot);
    if (r && r.catch) r.catch(() => { fsBtn.hidden = true; });
  } catch (e) { fsBtn.hidden = true; }
});
document.addEventListener('fullscreenchange', paintFs);
document.addEventListener('webkitfullscreenchange', paintFs);
paintFs();

/* ================= はじめ ================= */
// きろくが けされにくい ように たのんでおく（できない ばしょでは なにも しない）
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
loadMelodies();
updateStats();
paintMeter();
openHome();
// ひかえ（IndexedDB）の ほうが あたらしければ そちらに する（localStorage が きえて いた とき など）
kiroku('readonly', o => o.get('st')).then(s => {
  const b = s && JSON.parse(s);
  if (b && (b.t || 0) > (st.t || 0)) { replaceSt(b); updateStats(); if (view === 'home') openHome(); }
}).catch(() => {}).then(() => { backupOn = true; save(); });
})();
